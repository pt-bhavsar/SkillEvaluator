name: SARIF upload smoke test
on:
  push:
    branches:
      - sarif-upload-smoke-test
permissions:
  contents: read
  actions: read
  security-events: write
jobs:
  skills:
    uses: pt-bhavsar/SkillEvaluator/.github/workflows/evaluate-skills.yml@dc34611a6b747e32ea4325470a133ef359580eff
    with:
      image: ghcr.io/nvidia/skillevaluator-tier1@sha256:39c381bc9559be4fe30ede2b937d1a8577fcfedc66230a8e52b6fe5e79c23c94
      paths: tests/fixtures/skills
      scan-mode: all
      upload-sarif: true
      sarif-category: sarif-smoke-20261125
      enforcement-mode: advisory
